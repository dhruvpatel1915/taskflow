<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Taskflow: a fast, accessible Kanban board with drag and drop, search and live stats.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>Taskflow | Kanban board</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">✓</span> Taskflow</div>
    <input id="search" type="search" placeholder="Search tasks…" aria-label="Search tasks">
    <select id="priority" aria-label="Filter by priority">
      <option value="all">All priorities</option>
      <option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
    </select>
    <button id="theme" class="btn ghost" aria-label="Toggle theme">◐</button>
    <button id="new" class="btn primary">+ New task</button>
  </header>
  <main>
    <section id="stats" class="stats" aria-label="Project statistics"></section>
    <section id="board" class="board" aria-label="Task board"></section>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>Taskflow needs JavaScript to run.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
